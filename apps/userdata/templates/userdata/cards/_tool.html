{% load i18n %}
{# Инструмент анализа на карточке доски: параметры словами; расчёт — по ссылке «Открыть вид». #}
{% if phrases %}
  <ul class="board-card__phrases">
    {% for phrase in phrases %}<li>{{ phrase }}</li>{% endfor %}
  </ul>
{% endif %}
<p class="board-card__hint">{% translate "Расчёт выполняется заново на текущих данных, когда вид открыт." %}</p>
