{% load i18n glossary %}
{# Похожи ли соседи: глобальный индекс Морана и вывод правилом. #}
<div class="answer__figure study-card__answer">
  <p class="answer__value">
    <span class="numeric">{{ card.value }}</span>
    <span class="answer__unit">{% term "moran-index" _("индекс Морана") %}</span>
  </p>
</div>
<p class="answer__meta">
  <span><b>{{ card.direction }}</b></span>
  <span>{% blocktranslate trimmed with count=card.regions %}регионов: {{ count }}{% endblocktranslate %}</span>
  <span>p = <span class="numeric">{{ card.p_value }}</span></span>
</p>
