{% load i18n %}{# Сдвиг места: стрелка и модуль; плюс — подъём. #}{% if movement is None %}<span class="movement movement--flat">—</span>{% elif movement > 0 %}<span class="movement movement--up"><svg aria-hidden="true"><use href="#icon-arrow-up"></use></svg>{{ movement_abs }}<span class="visually-hidden"> {% translate "вверх" %}</span></span>{% elif movement < 0 %}<span class="movement movement--down"><svg aria-hidden="true"><use href="#icon-arrow-down"></use></svg>{{ movement_abs }}<span class="visually-hidden"> {% translate "вниз" %}</span></span>{% else %}<span class="movement movement--flat">0</span>{% endif %}
