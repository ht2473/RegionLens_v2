{% load i18n %}
{# Кнопка «Сохранить» региона или показателя: форма, с HTMX — замена кнопки; гостю — вход. #}
{% if request.user.is_authenticated %}
  <form method="post" action="{% url 'workspace:favorite-toggle' %}"
        hx-post="{% url 'workspace:favorite-toggle' %}"
        hx-swap="outerHTML"
        class="favorite-form">
    {% csrf_token %}
    <input type="hidden" name="kind" value="{{ favorite_kind }}">
    <input type="hidden" name="identifier" value="{{ favorite_identifier }}">
    <input type="hidden" name="back" value="{{ favorite_back }}">
    <button type="submit"
            class="button button--sm {% if favorite_active %}button--secondary{% else %}button--ghost{% endif %}"
            aria-pressed="{% if favorite_active %}true{% else %}false{% endif %}">
      <svg aria-hidden="true"><use href="#icon-bookmark"></use></svg>
      {% if favorite_active %}
        {% translate "Сохранено" %}
      {% else %}
        {% translate "Сохранить" %}
      {% endif %}
    </button>
  </form>
{% else %}
  <a class="button button--sm button--ghost"
     href="{% url 'accounts:login' %}?next={{ favorite_back|urlencode }}">
    <svg aria-hidden="true"><use href="#icon-bookmark"></use></svg>
    {% translate "Сохранить" %}
  </a>
{% endif %}
