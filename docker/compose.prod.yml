# =====================================================================================
# Рабочий стенд RegionLens.
#
# Запуск:    docker compose -f docker/compose.prod.yml --env-file .env up -d
# Остановка: docker compose -f docker/compose.prod.yml --env-file .env down
# Журналы:   docker compose -f docker/compose.prod.yml --env-file .env logs -f web
#
# --env-file нужен в каждом вызове: иначе Compose ищет docker/.env, POSTGRES_PASSWORD
# не подставляется, и разбор описания обрывается даже у `logs` и `ps`.
#
# Службы:
#   caddy    — обратный прокси, сертификаты, статика, журнал обращений;
#   web      — приложение (gunicorn), сборка склада из панели отдельным процессом,
#              сбор источников и статистика посещений по таймерам хоста;
#   userdata-worker — разбор и сборка больших таблиц пользователей по заявкам сайта;
#   postgres — учётные записи, справочники, обращения;
#   valkey   — кэш и счётчики ограничителей частоты.
#
# Наружу открыты только порты 80 и 443; порты базы и Valkey не публикуются. Сетей две:
# в edge — прокси и приложение, в backend — приложение, база и Valkey; у backend нет
# выхода наружу, а прокси базу и Valkey не видит. Контейнеры работают без лишних
# привилегий ядра (cap_drop) и не могут их повысить (no-new-privileges).
# Пределы памяти — для VPS с 8 ГБ: обычно стенду хватает около 1,2 ГБ, во время
# сборки склада — до 3 ГБ (прибавка — у web), разбор таблиц пользователей — ещё до 1,5 ГБ
# в своём контейнере.
# =====================================================================================

name: regionlens

x-app: &app
  image: ${REGIONLENS_IMAGE:-regionlens:latest}
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  env_file: ../.env
  environment: &app-environment
    DJANGO_SETTINGS_MODULE: config.settings.production
    VALKEY_URL: redis://valkey:6379
    DATABASE_URL: postgres://${POSTGRES_USER:-regionlens}:${POSTGRES_PASSWORD:?переменная POSTGRES_PASSWORD обязательна}@postgres:5432/${POSTGRES_DB:-regionlens}
    # Большие таблицы пользователей разбирает служба userdata-worker: сайт кладёт заявку.
    USERDATA_JOB_WORKER: "true"
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy
  # Выход наружу (почта, сбор источников) — через edge; база и Valkey — в backend.
  networks: [edge, backend]
  # Процесс № 1 — init: он собирает завершившиеся дочерние процессы (сборка склада, разборы)
  # и передаёт сигналы остановки.
  init: true
  # Приложение работает от непривилегированного пользователя: привилегии ядра ему не нужны.
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 512
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # --- Обратный прокси и сертификаты -----------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: regionlens-caddy
    restart: unless-stopped
    ports:
      # Порты — переменными: на стенде порт 443 может быть занят другой службой.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      # С пустым адресом Caddy не запускается; обязательность даёт отказ при разборе описания.
      ACME_EMAIL: "${ACME_EMAIL:?переменная ACME_EMAIL обязательна — адрес для удостоверяющего центра}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Журнал обращений — отдельно от сертификатов: его читает статистика посещений.
      - caddy_logs:/var/log/caddy
      # Статику отдаёт прокси, минуя приложение.
      - static:/srv/static:ro
    depends_on: [web]
    networks: [edge]
    # Из привилегий ядра — только право занять порты 80 и 443; своя файловая система
    # только на чтение, запись — в тома сертификатов и журнала.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 256
    # Тела запросов прокси принимает в память (до 32 МБ на запрос), сжатие — тоже в памяти:
    # под нагрузкой 128 МБ не хватало, и ядро останавливало прокси.
    mem_limit: 512m
    logging: *logging

  # --- Приложение ---------------------------------------------------------------------------
  web:
    <<: *app
    container_name: regionlens-web
    volumes:
      - warehouse:/app/data/warehouse
      # Загруженные из панели наборы: по ним собирается склад.
      - uploads:/app/data/uploads
      # Неизменяемый архив выпусков источников и их разбор: по ним склад продолжает ряды.
      - archive:/app/data/archive
      - sources:/app/data/sources
      - static:/app/staticfiles
      # Журнал Caddy — только на чтение; статистика посещений, накопленная GoAccess.
      - caddy_logs:/app/logs/caddy:ro
      - visits:/app/data/visits
      # Таблицы пользователей («Свои данные»): исходные файлы и их разбор.
      - userdata:/app/data/userdata
    environment:
      <<: *app-environment
      # Предел памяти самой сборки склада: она идёт в этом контейнере.
      DUCKDB_BUILD_MEMORY_LIMIT: ${DUCKDB_BUILD_MEMORY_LIMIT:-1GB}
      # Рабочих процессов gunicorn — по числу ядер сервера: сборка страницы занимает процессор.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    # Рабочие процессы сервера — 0,9–1,5 ГБ, сборка склада — ещё до 1,5 ГБ; в запросе —
    # маленькие таблицы пользователей и чтение PDF (до 40 страниц).
    mem_limit: 3584m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # --- Разбор таблиц пользователей -----------------------------------------------------------
  # Заявки сайта — в каталоге .jobs тома userdata; разборов сразу — не больше
  # USERDATA_PARALLEL_JOBS. Нехватка памяти обрывает разбор, а не сайт.
  userdata-worker:
    <<: *app
    container_name: regionlens-userdata-worker
    command: ["python", "manage.py", "userdata_worker"]
    volumes:
      - userdata:/app/data/userdata
      # Склад — население и официальные ряды для пересчётов; соединение только на чтение,
      # но каталог выгрузки DuckDB создаётся рядом с файлом.
      - warehouse:/app/data/warehouse
    # Миграции применяет web при запуске: служба ждёт его готовности.
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      web:
        condition: service_healthy
    # Два разбора около 0,7 ГБ каждый (DuckDB — USERDATA_PARSE_MEMORY) и сама служба.
    mem_limit: 1536m
    # Начатый разбор (не дольше USERDATA_JOB_SECONDS = 120 с) доводится до конца.
    stop_grace_period: 150s
    healthcheck:
      # Служба отмечается в очереди каждую секунду; тишина дольше минуты — зависла.
      test: ["CMD-SHELL", "test -n \"$$(find /app/data/userdata/.jobs/heartbeat -mmin -1 2>/dev/null)\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # --- Хранилища ---------------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: regionlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-regionlens}
      # Суперпользователь образа — служебный, для обслуживания изнутри контейнера. Роль
      # приложения (POSTGRES_USER из .env) заводит postgres-init.sh при создании каталога
      # данных: она владеет базой, но не сервером. Пароль образ требует при создании;
      # у суперпользователя сценарий его снимает.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?переменная POSTGRES_PASSWORD обязательна}
      APP_DB_USER: ${POSTGRES_USER:-regionlens}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?переменная POSTGRES_PASSWORD обязательна}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      # С версии 18 образ хранит данные в подкаталоге версии и ждёт том на уровень выше.
      - postgres_data:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    # Настройки — для VPS с 4 ГБ; значения по умолчанию рассчитаны на машину много меньше.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-60}
      # Диск виртуального сервера — твердотельный: стоимость случайного чтения
      # почти равна стоимости последовательного.
      - -c
      - random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-regionlens} -d ${POSTGRES_DB:-regionlens}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    # Точка входа образа назначает владельца каталога данных и переходит к пользователю
    # postgres: нужны только эти привилегии.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1024m
    logging: *logging

  valkey:
    image: valkey/valkey:8-alpine
    container_name: regionlens-valkey
    restart: unless-stopped
    # Предел памяти — 128 МБ; при нехватке вытесняются давно не читанные ключи.
    # На диск ничего не пишется: кэш после перезапуска собирается заново.
    command:
      - valkey-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "no"
      - --save
      - ""
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]
    # Точка входа переходит к пользователю valkey; на диск служба не пишет.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    pids_limit: 128
    mem_limit: 192m
    logging: *logging

networks:
  # Прокси и приложение; через неё приложение выходит наружу.
  edge:
    driver: bridge
  # Приложение, база и Valkey; выхода наружу нет.
  backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  caddy_logs:
  warehouse:
  uploads:
  archive:
  sources:
  visits:
  userdata:
  static:
