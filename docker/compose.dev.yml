# Инфраструктура для локальной разработки: PostgreSQL и Valkey.
# Приложение запускается на хосте (`uv run python main.py`).
#
# Запуск:   docker compose -f docker/compose.dev.yml up -d
# Останов:  docker compose -f docker/compose.dev.yml down
# Очистка:  docker compose -f docker/compose.dev.yml down -v

name: regionlens-dev

services:
  postgres:
    image: postgres:18-alpine
    container_name: regionlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: regionlens
      POSTGRES_USER: regionlens
      POSTGRES_PASSWORD: regionlens
      # Кодировка и правило сравнения — явно, чтобы сортировка русских названий была предсказуемой.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # С версии 18 образ хранит данные в подкаталоге версии (/var/lib/postgresql/18/docker)
      # и ждёт том на уровень выше.
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regionlens -d regionlens"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    container_name: regionlens-valkey
    restart: unless-stopped
    # Те же ограничения, что на стенде: 128 МБ, вытесняются давно не читанные ключи.
    command: ["valkey-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres18_data:
    name: regionlens_postgres18_data
