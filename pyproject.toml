[project]
name = "regionlens"
version = "0.1.0"
description = "RegionLens — веб-приложение для анализа и визуализации социально-экономических показателей регионов РФ"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
authors = [{ name = "Кузьмин Евгений Олегович", email = "lord10000297@gmail.com" }]
keywords = ["regional-statistics", "rosstat", "data-analysis", "django", "duckdb"]

# --------------------------------------------------------------------------------------
# Зависимости приложения; точные версии — в uv.lock.
# --------------------------------------------------------------------------------------
dependencies = [
    # --- Веб-фреймворк и его инфраструктура -------------------------------------------
    "django>=6.1,<6.2",              # веб-фреймворк
    "django-environ>=0.12",          # чтение настроек из переменных окружения и .env
    "psycopg[binary]>=3.2",          # драйвер PostgreSQL
    "whitenoise[brotli]>=6.9",       # отдача статики самим приложением
    "argon2-cffi>=25.1",             # хеширование паролей Argon2
    "django-axes>=8.3",              # защита формы входа от перебора
    "django-parler>=2.4",            # переводимые поля моделей (двуязычие RU/EN)
    "django-filter>=26.1",           # декларативная фильтрация в API и списках
    # --- REST API ----------------------------------------------------------------------
    "djangorestframework>=3.18",     # открытый интерфейс данных
    "drf-spectacular[sidecar]>=0.30",# схема OpenAPI 3.1; sidecar отдаёт Swagger UI локально
    # --- Кэш ------------------------------------------------------------------------------
    "redis>=6.4",                    # клиент Valkey: кэш Django и счётчики ограничителей
    # --- Хранилище аналитических данных -------------------------------------------------
    "duckdb>=1.4",                   # аналитический склад
    "pyarrow>=21.0",                 # чтение и запись Parquet
    "pandas>=2.3",                   # подготовка и трансформация табличных данных
    "numpy>=2.3",                    # численные операции
    # --- Статистика -----------------------------------------------------------------------
    "scipy>=1.16",                   # статистические тесты, распределения, оптимизация
    # --- Формирование документов -----------------------------------------------------------
    "openpyxl>=3.1",                 # выгрузка XLSX
    "reportlab>=4.4",                # выгрузка PDF
    # --- Сбор выпусков источников ------------------------------------------------------------
    "python-calamine>=0.4",          # чтение таблиц Росстата в xls и xlsx
    # --- Служебные ---------------------------------------------------------------------------
    "python-slugify>=8.0",           # транслитерация кириллицы в ЧПУ-адреса
]

[project.optional-dependencies]
# Сервер рабочего стенда; в разработке — runserver.
production = [
    "gunicorn>=23.0",
    "sentry-sdk[django]>=2.35",
]

[dependency-groups]
dev = [
    # --- Тестирование -----------------------------------------------------------------------
    "pytest>=8.4",
    "pytest-django>=4.11",
    "pytest-cov>=6.2",
    "playwright>=1.55",              # сквозные проверки в браузере
    "pytest-playwright>=0.7",
    "fonttools[woff]>=4.60",         # проверки шрифтов (tests/unit/test_typography.py), og_cover.py

    # --- Качество кода -----------------------------------------------------------------------
    "ruff>=0.13",                    # линтер и форматтер
    "mypy>=1.18",                    # статическая типизация
    "django-stubs[compatible-mypy]>=6.1",
    "types-python-slugify>=8.0",
    "bandit>=1.8",                   # статический анализ безопасности
    "pip-audit>=2.9",                # проверка зависимостей на известные уязвимости
    "pre-commit>=4.3",

    # --- Разработка ---------------------------------------------------------------------------
    "django-debug-toolbar>=8.0",
    "django-extensions>=4.1",
    "ipython>=9.5",
]

[tool.uv]
default-groups = ["dev"]

# --------------------------------------------------------------------------------------
# Ruff: линтер и форматирование.
# --------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["*/migrations/*", ".venv", "data"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "C4",        # flake8-comprehensions
    "DJ",        # flake8-django
    "SIM",       # flake8-simplify
    "PTH",       # flake8-use-pathlib
    "RUF",       # правила самого ruff
    "S",         # bandit-подмножество
    "T20",       # запрет print в продакшн-коде
    "ARG",       # неиспользуемые аргументы
    "PL",        # pylint-подмножество
]
ignore = [
    "RUF001",    # кириллица в строках
    "RUF002",
    "RUF003",
    "RUF012",    # изменяемые атрибуты класса без ClassVar (характерно для Django Meta)
    "PLR0913",   # число аргументов
    "S101",      # assert допустим в тестах и внутренних проверках инвариантов
    # Отложенный импорт: модуль загружается до инициализации приложений Django.
    "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLR2004", "ARG"]
# Генератор синтетического набора — одна длинная линейная функция.
"tests/support/synthetic.py" = ["S", "PLR2004", "ARG", "PLR0912", "PLR0915", "PLR0917"]
"apps/*/management/commands/*" = ["T20"]  # вывод в консоль — назначение команд
"scripts/*" = ["T20"]
"main.py" = ["T20"]
# Запросы ETL-конвейера собираются из констант модуля и имён столбцов схемы склада;
# пользовательские данные передаются только параметрами (см. duckdb_client).
"apps/warehouse/etl/*" = ["S608"]
"apps/*/migrations/*" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

# --------------------------------------------------------------------------------------
# Mypy: статическая типизация с поддержкой Django через django-stubs.
# --------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = ["migrations/", "\\.venv/", "data/"]

# Библиотеки без сведений о типах.
[[tool.mypy.overrides]]
module = [
    "axes.*",
    "drf_spectacular.*",
    "duckdb.*",
    "environ.*",
    "openpyxl.*",
    # pandas-stubs и scipy-stubs на датафреймах, форма которых задаётся данными,
    # дают больше ложных замечаний, чем находок.
    "pandas.*",
    "pyarrow.*",
    "parler.*",
    "reportlab.*",
    "rest_framework.*",
    "scipy.*",
    "sentry_sdk.*",
    "whitenoise.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# --------------------------------------------------------------------------------------
# Bandit: анализ безопасности прикладного кода; в тестах слабые пароли и обращения
# к внутренним функциям намеренны.
# --------------------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = [".venv", "tests", "data"]
skips = [
    # B101 — assert: проверки внутренних инвариантов.
    "B101",
    # B608 — сборка запроса из строк. Запросы к DuckDB собираются из констант и имён
    # столбцов, значения идут параметрами, подставляемые имена сверяются с белым
    # списком (validate_identifier); правило этого не различает.
    "B608",
]

# --------------------------------------------------------------------------------------
# Pytest.
# --------------------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
# Сквозным сценариям нужны браузеры Playwright и сервер: запуск — `pytest -m e2e`.
addopts = "--strict-markers --strict-config -ra -m 'not e2e'"
markers = [
    "unit: модульные тесты без обращения к базе данных",
    "integration: интеграционные тесты с базой данных и складом DuckDB",
    "e2e: сквозные браузерные сценарии",
    "slow: длительные тесты (полный ETL)",
    "security: проверки безопасности",
    "smoke: краткий прогон по всем разделам",
]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
precision = 1
